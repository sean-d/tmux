##### Terminal and Color Support #####
set -g default-terminal "tmux-256color"
# True color for any outer terminal (Ghostty, Alacritty, kitty...), not just *256col* TERMs.
set -as terminal-features ",*:RGB"
# Extended keys so apps can tell Shift+Enter, Ctrl+Enter, etc. apart (needed by claude).
set -g extended-keys on
set -as terminal-features ",*:extkeys"

##### Tmux Behavior #####
set -g allow-rename off
set -s escape-time 5
set -g history-limit 5000
set -g mouse on 
set -g status-interval 5

##### Prefix and Keybindings #####
unbind C-b
set -g prefix C-Space
unbind Space

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux config'

# Split windows using | and - in the current path
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window navigation (Alt + arrows)
bind -n M-Left previous-window
bind -n M-Right next-window

# Pane navigation is handled by Ctrl+hjkl below

# Pane resize (Alt + hjkl)
bind -n M-h resize-pane -L 2
bind -n M-l resize-pane -R 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2

# Smooth scrolling with mouse
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

##### Smart Pane Navigation (Neovim Integration) #####
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


##### Status Bar Configuration #####
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Status bar position
set -g status-position top

# Status bar styling
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 50
set -g status-right-length 50

# Left side of status bar - show session name
set -g status-left '#[fg=#f5c2e7,bold]  #S #[fg=#cdd6f4]| '

# Window status
set-window-option -g window-status-current-format '#[fg=#f5c2e7,bold] #I:#W '
set-window-option -g window-status-format '#[fg=#cdd6f4] #I:#W '

# Right side - show date and time
set -g status-right '#[fg=#cdd6f4]%a %b %d #[fg=#cdd6f4]| #[fg=#f5c2e7]%I:%M %p '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#f5c2e7'

# Message styling
set -g message-style 'fg=#cdd6f4 bg=#313244'

##### TPM Plugin List #####
set -g @tpm_plugins '
  tmux-plugins/tpm
  tmux-plugins/tmux-sensible
  tmux-plugins/tmux-resurrect
  tmux-plugins/tmux-continuum
  christoomey/vim-tmux-navigator
  alexwforsythe/tmux-which-key
'

##### TPM Controls #####
# Everything lives in ~/.config/tmux/plugins (git-ignored), next to this file.
bind I run '~/.config/tmux/plugins/tpm/bin/install_plugins' \; display 'Installing plugins...'
bind U run '~/.config/tmux/plugins/tpm/bin/update_plugins' \; display 'Updating plugins...'

##### Bootstrap TPM and plugins on a fresh machine #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

##### Initialize TPM (must be last) #####
run '~/.config/tmux/plugins/tpm/tpm'
